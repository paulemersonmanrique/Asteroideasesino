<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☄️ Asteroide Asesino - Sistema Solar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0f1e;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
            overflow: hidden;
        }
        .game-wrapper {
            background: #141a2b;
            padding: 20px 20px 20px 20px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 0 1px #3e4b66;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            display: block;
            margin: 0 auto;
            width: 400px;
            height: 600px;
            background: radial-gradient(circle at 20% 80%, #1a2340, #0b0f1a);
            border-radius: 24px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7), 0 10px 20px rgba(0, 0, 0, 0.6);
            cursor: none;
            touch-action: none;
            flex-shrink: 0;
            position: relative;
        }
        
        /* ===== PAD ANALÓGICO FIJO CON INFO ===== */
        .analog-pad-wrapper {
            position: relative;
            display: block;
            width: 100%;
            max-width: 450px;
            margin-top: 12px;
            padding: 0 10px;
            height: 140px;
        }

        .analog-pad-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: block;
        }

        .analog-pad {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(60, 80, 120, 0.5), rgba(20, 30, 50, 0.85));
            border: 2px solid rgba(100, 140, 200, 0.3);
            box-shadow: 0 0 40px rgba(50, 100, 200, 0.1), inset 0 0 40px rgba(0, 0, 0, 0.5);
            touch-action: none;
            pointer-events: auto;
            display: block;
            flex-shrink: 0;
        }
        .analog-pad .center {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(100, 180, 255, 0.5), rgba(40, 80, 160, 0.2));
            border: 1px solid rgba(100, 180, 255, 0.15);
            pointer-events: none;
            transition: all 0.05s;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .analog-pad .thumb {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(120, 200, 255, 0.5), rgba(40, 80, 180, 0.65));
            border: 2px solid rgba(100, 180, 255, 0.35);
            box-shadow: 0 0 25px rgba(50, 150, 255, 0.2), inset 0 -5px 15px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            transition: none;
            transform: translate(-50%, -50%);
            touch-action: none;
        }
        .analog-pad .thumb::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.4), rgba(100, 180, 255, 0.1));
        }
        .analog-pad .direction-indicator {
            position: absolute;
            color: rgba(100, 180, 255, 0.12);
            font-size: 16px;
            pointer-events: none;
            font-weight: bold;
        }
        .analog-pad .dir-up { top: 6px; left: 50%; transform: translateX(-50%); }
        .analog-pad .dir-down { bottom: 6px; left: 50%; transform: translateX(-50%); }
        .analog-pad .dir-left { left: 6px; top: 50%; transform: translateY(-50%); }
        .analog-pad .dir-right { right: 6px; top: 50%; transform: translateY(-50%); }

        /* ===== INFO CENTRADA - FUENTE 140% ===== */
        .pad-info-left {
            position: absolute;
            left: 0px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            padding: 10px 14px;
            min-width: 70px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .pad-info-left .info-item {
            display: block;
            padding: 3px 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #b7d0f0;
            text-shadow: 0 0 15px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.7);
            font-family: 'Segoe UI', system-ui, sans-serif;
            letter-spacing: 0.3px;
            white-space: nowrap;
            text-align: center;
            width: 100%;
        }
        .pad-info-left .info-item .value.energy {
            color: #ffbb77;
        }
        .pad-info-left .info-item .value.timer {
            color: #ff8833;
        }
        .pad-info-left .info-item .value.structure {
            color: #4fc3f7;
        }

        .pad-info-right {
            position: absolute;
            right: 0px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            padding: 10px 14px;
            min-width: 70px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .pad-info-right .info-item {
            display: block;
            padding: 3px 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #b7d0f0;
            text-shadow: 0 0 15px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.7);
            font-family: 'Segoe UI', system-ui, sans-serif;
            letter-spacing: 0.3px;
            white-space: nowrap;
            text-align: center;
            width: 100%;
        }
        .pad-info-right .info-item .value.level {
            color: #ffcc88;
        }
        .pad-info-right .info-item .value.size {
            color: #8899bb;
        }

        .ui-panel {
            display: none;
        }

        .relative {
            position: relative;
        }

        #gameOverMsg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a0f1ee0;
            backdrop-filter: blur(4px);
            padding: 24px 36px;
            border-radius: 60px;
            border: 2px solid #ff7b5a;
            color: #ffe2c0;
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            box-shadow: 0 0 60px #ff5e3a66;
            pointer-events: none;
            display: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #gameOverMsg.show {
            display: block;
            opacity: 1;
        }
        #gameOverMsg small {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: #b7c9e6;
            margin-top: 8px;
        }
        #gameOverMsg.win {
            border-color: #6aaa5a;
            box-shadow: 0 0 60px #4a7a3a66;
        }
        #gameOverMsg.win small {
            color: #8acc7a;
        }
        #gameOverMsg.hidden {
            display: none !important;
        }

        button {
            background: #2f3f62;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 4px 14px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 5px 0 #0c121f, 0 4px 12px #00000066;
            transition: all 0.08s linear;
            letter-spacing: 0.5px;
            border: 1px solid #5f77a0;
            display: none;
            touch-action: manipulation;
            pointer-events: auto;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0c121f;
        }
        button.visible {
            display: block;
        }
        button.next-level {
            background: #4a7a3a;
            border-color: #6aaa5a;
            box-shadow: 0 5px 0 #2a4a1a, 0 4px 20px #4a7a3a66;
            animation: pulse-glow 1.5s ease-in-out infinite;
        }
        button.next-level:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #2a4a1a;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 5px 0 #2a4a1a, 0 4px 20px #4a7a3a66; }
            50% { box-shadow: 0 5px 0 #2a4a1a, 0 4px 40px #6aaa5aaa; }
        }

        .button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
            pointer-events: none;
        }
        .button-container button {
            pointer-events: auto;
        }

        .music-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #4fc3f7;
            font-size: 0.7rem;
            background: rgba(10, 15, 30, 0.7);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(79, 195, 247, 0.3);
            backdrop-filter: blur(4px);
            z-index: 1000;
            pointer-events: none;
            animation: pulse-music 1s ease-in-out infinite;
        }
        @keyframes pulse-music {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @media (max-width: 500px) {
            .analog-pad {
                width: 120px;
                height: 120px;
            }
            .analog-pad .thumb {
                width: 40px;
                height: 40px;
            }
            .analog-pad .center {
                width: 14px;
                height: 14px;
            }
            .game-wrapper {
                padding: 12px 12px 12px 12px;
            }
            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 400/600;
                max-width: 400px;
            }
            .analog-pad-wrapper {
                height: 120px;
            }
            .pad-info-left {
                padding: 6px 8px;
                min-width: 50px;
                left: 0px;
            }
            .pad-info-right {
                padding: 6px 8px;
                min-width: 50px;
                right: 0px;
            }
            .pad-info-left .info-item, .pad-info-right .info-item {
                font-size: 1.05rem;
                padding: 2px 0;
            }
            .music-indicator {
                font-size: 0.5rem;
                padding: 2px 8px;
            }
        }
        @media (max-width: 400px) {
            .analog-pad {
                width: 100px;
                height: 100px;
            }
            .analog-pad .thumb {
                width: 34px;
                height: 34px;
            }
            .analog-pad .center {
                width: 12px;
                height: 12px;
            }
            .analog-pad .direction-indicator {
                font-size: 12px;
            }
            .analog-pad-wrapper {
                height: 100px;
            }
            .pad-info-left {
                padding: 4px 6px;
                min-width: 40px;
                left: 0px;
            }
            .pad-info-right {
                padding: 4px 6px;
                min-width: 40px;
                right: 0px;
            }
            .pad-info-left .info-item, .pad-info-right .info-item {
                font-size: 0.9rem;
                padding: 1px 0;
            }
        }
    </style>
</head>
<body>

    <div class="music-indicator" id="musicIndicator">🎵 Música Arcade</div>

    <div class="game-wrapper">
        <div class="relative">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
            <div id="gameOverMsg">💥 IMPACTO<br><small>Mensaje</small></div>
        </div>

        <div class="ui-panel">
            <div class="stats">
                <span>⚡ <span id="velDisplay">100</span>%</span>
                <span>🧱 <span id="structureDisplay">5</span></span>
                <span>💀 <span id="killDisplay">0</span></span>
            </div>
            <div class="level-indicator" id="levelDisplay">☿ Mercurio</div>
            <div class="size-info" id="sizeDisplay">4.880 km</div>
            <div class="timer" id="timerDisplay">⏱ 0s</div>
        </div>

        <div class="analog-pad-wrapper">
            <div class="pad-info-left" id="padInfoLeft">
                <div class="info-item">
                    <span class="value energy" id="padVel">100%</span>
                </div>
                <div class="info-item">
                    <span class="value timer" id="padTimer">0s</span>
                </div>
                <div class="info-item">
                    <span class="value structure" id="padStruct">5</span>
                </div>
            </div>

            <div class="analog-pad-container">
                <div class="analog-pad" id="analogPad">
                    <span class="direction-indicator dir-up">▲</span>
                    <span class="direction-indicator dir-down">▼</span>
                    <span class="direction-indicator dir-left">◄</span>
                    <span class="direction-indicator dir-right">►</span>
                    <div class="center"></div>
                    <div class="thumb" id="thumb"></div>
                </div>
            </div>

            <div class="pad-info-right" id="padInfoRight">
                <div class="info-item">
                    <span class="value level" id="padLevel">Mercurio</span>
                </div>
                <div class="info-item">
                    <span class="value size" id="padSize">4.880 km</span>
                </div>
            </div>
        </div>
    </div>

    <div class="button-container">
        <button id="resetBtn">⟳ Reiniciar</button>
        <button id="nextLevelBtn" class="next-level">🚀 Siguiente</button>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            const padVel = document.getElementById('padVel');
            const padStruct = document.getElementById('padStruct');
            const padLevel = document.getElementById('padLevel');
            const padTimer = document.getElementById('padTimer');
            const padSize = document.getElementById('padSize');

            const gameOverDiv = document.getElementById('gameOverMsg');
            const resetBtn = document.getElementById('resetBtn');
            const nextLevelBtn = document.getElementById('nextLevelBtn');

            const W = 400,
                H = 600;

            // ========== CONTROL DEL PAD ANALÓGICO ==========
            const analogPad = document.getElementById('analogPad');
            const thumb = document.getElementById('thumb');
            let isTouching = false;
            const PAD_RADIUS = 70;
            const THUMB_RADIUS = 24;
            
            let padX = 0;
            let padY = 0;

            function getPadCenter() {
                const rect = analogPad.getBoundingClientRect();
                return {
                    cx: rect.left + rect.width / 2,
                    cy: rect.top + rect.height / 2,
                    maxDist: Math.min(rect.width, rect.height) / 2 - THUMB_RADIUS,
                    width: rect.width,
                    height: rect.height
                };
            }

            function updateThumbPosition(clientX, clientY) {
                const { cx, cy, maxDist, width, height } = getPadCenter();
                
                let dx = clientX - cx;
                let dy = clientY - cy;
                const dist = Math.hypot(dx, dy);
                
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                
                thumb.style.left = (width / 2 + dx) + 'px';
                thumb.style.top = (height / 2 + dy) + 'px';
                
                padX = dx / maxDist;
                padY = dy / maxDist;
                if (dist < 5) {
                    padX = 0;
                    padY = 0;
                }
            }

            function resetThumb() {
                const rect = analogPad.getBoundingClientRect();
                thumb.style.left = (rect.width / 2) + 'px';
                thumb.style.top = (rect.height / 2) + 'px';
                padX = 0;
                padY = 0;
                isTouching = false;
            }

            analogPad.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                isTouching = true;
                updateThumbPosition(touch.clientX, touch.clientY);
            }, { passive: false });

            analogPad.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!isTouching) return;
                const touch = e.touches[0];
                updateThumbPosition(touch.clientX, touch.clientY);
            }, { passive: false });

            analogPad.addEventListener('touchend', (e) => {
                e.preventDefault();
                resetThumb();
            }, { passive: false });

            analogPad.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                resetThumb();
            }, { passive: false });

            let mouseDown = false;
            analogPad.addEventListener('mousedown', (e) => {
                e.preventDefault();
                mouseDown = true;
                isTouching = true;
                updateThumbPosition(e.clientX, e.clientY);
            });

            document.addEventListener('mousemove', (e) => {
                if (!mouseDown) return;
                updateThumbPosition(e.clientX, e.clientY);
            });

            document.addEventListener('mouseup', (e) => {
                if (mouseDown) {
                    mouseDown = false;
                    resetThumb();
                }
            });

            resetThumb();

            // ========== SISTEMA DE PLANETAS ==========
            const PLANETS = [
                { name: 'Mercurio', color: '#b5a8a0', colors: ['#b5a8a0', '#8a7a6a', '#a09080'], size_km: 4880, appearTime: 22, speed: 0.45 },
                { name: 'Venus', color: '#f5e6c8', colors: ['#f5e6c8', '#e8d5b0', '#f0e0c0'], size_km: 12104, appearTime: 25, speed: 0.40 },
                { name: 'Tierra', color: '#4a8cff', colors: ['#4a8cff', '#2d8a4e', '#8b7355', '#6ab0ff'], size_km: 12756, appearTime: 28, speed: 0.35 },
                { name: 'Marte', color: '#c45a3a', colors: ['#c45a3a', '#b84428', '#d46a4a', '#a03828'], size_km: 6794, appearTime: 24, speed: 0.42 },
                { name: 'Júpiter', color: '#d4a06a', colors: ['#d4a06a', '#c89060', '#e8b880', '#b08860', '#f0d0a0'], size_km: 142984, appearTime: 35, speed: 0.25 },
                { name: 'Saturno', color: '#d4c48a', colors: ['#d4c48a', '#c8b878', '#e0d098', '#b8a868'], size_km: 108728, appearTime: 33, speed: 0.27 },
                { name: 'Urano', color: '#7ad4d4', colors: ['#7ad4d4', '#5ab8b8', '#9ae8e8', '#4aa0a0'], size_km: 51118, appearTime: 30, speed: 0.30 },
                { name: 'Neptuno', color: '#3a6acc', colors: ['#3a6acc', '#2a5ab8', '#4a7adc', '#1a4aaa'], size_km: 49532, appearTime: 28, speed: 0.32 }
            ];

            const ASTEROID_COLORS = [
                ['#ffcc00', '#ffaa00', '#ff8800', '#66ff33'],
                ['#ffaa00', '#ff6600', '#ff3333', '#55ff22'],
                ['#ffdd44', '#ff8800', '#ff4422', '#77ff44'],
                ['#ffbb22', '#ff7700', '#ff2222', '#44ff11'],
                ['#ffcc33', '#ff9933', '#ff5533', '#66ff55'],
                ['#ffdd55', '#ffaa33', '#ff6644', '#55ff33'],
                ['#ffbb44', '#ff8833', '#ff4433', '#44ff22'],
                ['#ffcc55', '#ff9922', '#ff3322', '#66ff44']
            ];

            function getPlanetRadius(planet) {
                const minRadius = 18 * 2.3;
                const maxRadius = 75 * 2.3;
                const minSize = 4880;
                const maxSize = 142984;
                const logMin = Math.log(minSize);
                const logMax = Math.log(maxSize);
                const logValue = Math.log(planet.size_km);
                const t = (logValue - logMin) / (logMax - logMin);
                return minRadius + t * (maxRadius - minRadius);
            }

            let currentPlanetIndex = 0;
            let enemyBaseSpeed = 2;
            let spawnRate = 35;
            let currentColorIndex = 0;

            // ---------- FONDO ----------
            let starOffset = 0;
            const STAR_SPEED = 1;
            const stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: 0.5 + Math.random() * 2,
                    brightness: 0.2 + Math.random() * 0.8,
                    speed: 0.3 + Math.random() * 2,
                    layer: Math.floor(Math.random() * 3)
                });
            }
            for (let i = 0; i < 50; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: -Math.random() * H,
                    size: 0.5 + Math.random() * 2,
                    brightness: 0.2 + Math.random() * 0.8,
                    speed: 0.3 + Math.random() * 2,
                    layer: Math.floor(Math.random() * 3)
                });
            }

            // ========== SISTEMA DE AUDIO - MÚSICA AL 100% ==========
            let audioCtx = null;
            let musicActive = false;
            let musicGain = null;
            let audioInitialized = false;
            let musicInterval = null;
            let currentMelody = 0;
            let bassInterval = null;
            let drumInterval = null;
            let isMusicPaused = false;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    musicGain = audioCtx.createGain();
                    musicGain.gain.value = 1.0;  // Volumen al 100%
                    musicGain.connect(audioCtx.destination);
                }
            }

            function pauseMusic() {
                if (musicActive && !isMusicPaused) {
                    isMusicPaused = true;
                    if (musicInterval) {
                        clearInterval(musicInterval);
                        musicInterval = null;
                    }
                    if (bassInterval) {
                        clearInterval(bassInterval);
                        bassInterval = null;
                    }
                    if (drumInterval) {
                        clearInterval(drumInterval);
                        drumInterval = null;
                    }
                    document.getElementById('musicIndicator').textContent = '🎵 Música Pausada';
                }
            }

            function resumeMusic() {
                if (isMusicPaused) {
                    isMusicPaused = false;
                    if (musicActive) {
                        musicInterval = setInterval(playArcadeMelody, 375);
                        bassInterval = setInterval(playArcadeBass, 750);
                        drumInterval = setInterval(playArcadeDrums, 500);
                        document.getElementById('musicIndicator').textContent = '🎵 Música Arcade (40%)';
                    }
                }
            }

            function playArcadeMelody() {
                if (!musicActive || !audioCtx || isMusicPaused) return;
                
                try {
                    const now = audioCtx.currentTime;
                    
                    const melodies = [
                        [523, 659, 784, 523, 659, 784, 880, 784],
                        [494, 587, 740, 494, 587, 740, 880, 784],
                        [440, 554, 659, 440, 554, 659, 880, 784],
                        [392, 523, 659, 392, 523, 659, 784, 880],
                        [523, 659, 784, 880, 784, 659, 523, 392],
                        [587, 740, 880, 587, 740, 880, 988, 880]
                    ];
                    
                    const mel = melodies[currentMelody % melodies.length];
                    const duration = 0.2;
                    
                    for (let i = 0; i < 4; i++) {
                        const noteIndex = (Math.floor(Math.random() * mel.length));
                        const freq = mel[noteIndex] * (0.9 + Math.random() * 0.2);
                        const osc = audioCtx.createOscillator();
                        osc.type = ['square', 'sawtooth', 'triangle'][Math.floor(Math.random() * 3)];
                        osc.frequency.setValueAtTime(freq, now + i * 0.125);
                        
                        const gain = audioCtx.createGain();

                    ctx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.globalAlpha = alpha * 0.3;
                    ctx.lineWidth = (ring.width || 3) * 0.5;
                    ctx.beginPath();

            // ---------- Funciones para polígonos ----------
            function generateIrregularPolygon(radius, vertices, irregularity) {
                const points = [];
                for (let i = 0; i < vertices; i++) {
                    const angle = (i / vertices) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
                    const r = radius * (0.5 + Math.random() * irregularity);
                    points.push({
                        x: Math.cos(angle) * r,
                        y: Math.sin(angle) * r
                    });
                }
                return points;
            }

            function calculateAverageRadius(polygon) {
                if (!polygon || polygon.length === 0) return 20;
                let totalRadius = 0;
                for (let point of polygon) {
                    const radius = Math.hypot(point.x, point.y);
                    totalRadius += radius;
                }
                return totalRadius / polygon.length;
            }

            let continentPoints = [];

            function generateStaticContinents() {
                continentPoints = [];
                const continentData = [
                    { cx: -15, cy: -20, r: 35, v: 8, irr: 0.5 },
                    { cx: 25, cy: -10, r: 25, v: 7, irr: 0.5 },
                    { cx: -10, cy: 20, r: 30, v: 9, irr: 0.5 },
                    { cx: 30, cy: 25, r: 20, v: 6, irr: 0.5 },
                    { cx: -30, cy: 5, r: 18, v: 6, irr: 0.5 },
                    { cx: 5, cy: -35, r: 15, v: 5, irr: 0.5 },
                ];
                for (let data of continentData) {
                    const points = generateContinent(0, 0, data.r, data.v, data.irr);
                    continentPoints.push({
                        points,
                        offsetX: data.cx,
                        offsetY: data.cy,
                        color: `hsl(${110 + Math.random() * 30}, ${50 + Math.random() * 30}%, ${35 + Math.random() * 25}%)`
                    });
                }
            }

            function generateContinent(cx, cy, radius, vertices, irregularity) {
                const points = [];
                for (let i = 0; i < vertices; i++) {
                    const angle = (i / vertices) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
                    const r = radius * (0.4 + Math.random() * irregularity);
                    points.push({
                        x: cx + Math.cos(angle) * r,
                        y: cy + Math.sin(angle) * r
                    });
                }
                return points;
            }

            function drawSolidPolygon(ctx, points, color, shadowColor) {
                if (points.length < 3) return;
                ctx.save();
                ctx.shadowColor = shadowColor || "transparent";
                ctx.shadowBlur = 8;
                ctx.fillStyle = color || "#8a7a6a";
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = "rgba(20, 60, 20, 0.4)";
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
                ctx.shadowBlur = 0;
            }

            function drawPlayerPolygon(ctx, x, y, points, color, shadowColor, rotation, glow, glowColor) {
                if (points.length < 3) return;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation || 0);
                ctx.shadowColor = shadowColor || "#b07c4a";
                ctx.shadowBlur = glow ? 30 : 15;
                ctx.fillStyle = color || "#8a7a6a";
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = "rgba(30, 20, 15, 0.7)";
                ctx.lineWidth = 1.5;
                ctx.stroke();
                if (glow) {
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = glowColor || "rgba(255, 200, 100, 0.4)";
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length; i++) {
                        ctx.lineTo(points[i].x, points[i].y);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
                ctx.restore();
                ctx.shadowBlur = 0;
            }

            function drawUfo(ctx, ufo) {
                const { x, y, size, direction } = ufo;
                const w = size * 2.5;
                const h = size * 1.2;
                
                ctx.save();
                ctx.translate(x, y);
                
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = 40;
                
                ctx.beginPath();
                ctx.ellipse(0, 0, w, h * 0.3, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 200, 150, 0.6)';
                ctx.fill();
                
                ctx.shadowBlur = 20;
                
                ctx.beginPath();
                ctx.ellipse(0, -h * 0.2, w * 0.5, h * 0.3, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(100, 255, 200, 0.5)';
                ctx.fill();
                
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.ellipse(0, -h * 0.1, w * 0.2, h * 0.35, 0, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(0, -h * 0.3, 0, 0, -h * 0.1, h * 0.3);
                grad.addColorStop(0, 'rgba(150, 255, 255, 0.9)');
                grad.addColorStop(0.5, 'rgba(0, 200, 200, 0.7)');
                grad.addColorStop(1, 'rgba(0, 100, 150, 0.3)');
                ctx.fillStyle = grad;
                ctx.fill();
                
                ctx.shadowBlur = 15;
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const lx = Math.cos(angle) * w * 0.9;
                    const ly = Math.sin(angle) * h * 0.25;
                    ctx.beginPath();
                    ctx.arc(lx, ly, 2 + Math.random() * 2, 0, Math.PI * 2);
                    const brightness = 0.5 + Math.random() * 0.5;
                    ctx.fillStyle = `rgba(0, 255, 150, ${brightness})`;
                    ctx.fill();
                }
                
                ctx.shadowBlur = 50;
                ctx.shadowColor = 'rgba(0, 255, 150, 0.3)';
                ctx.beginPath();
                ctx.moveTo(-w * 0.3, h * 0.3);
                ctx.lineTo(w * 0.3, h * 0.3);
                ctx.lineTo(w * 0.1, h * 0.8);
                ctx.lineTo(-w * 0.1, h * 0.8);
                ctx.closePath();
                ctx.fillStyle = 'rgba(0, 255, 150, 0.08)';
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            // ========== DIBUJAR PLANETA CON BORDE NEGRO MÁS DELGADO ==========
            function drawPlanet(ctx, planet, radius) {
                const { x, y, name, colors } = planet;
                const mainColor = colors[0];
                
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(x, y, radius + 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.shadowColor = mainColor;
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.arc(x, y, radius + 2, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255,255,255,0.02)";
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.shadowColor = mainColor;
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(
                    x - radius * 0.2, y - radius * 0.2, 0,
                    x, y, radius
                );
                
                if (name === 'Tierra') {
                    grad.addColorStop(0, '#6ab0ff');
                    grad.addColorStop(0.3, '#4a8cff');
                    grad.addColorStop(0.5, '#2d8a4e');
                    grad.addColorStop(0.7, '#8b7355');
                    grad.addColorStop(0.9, '#4a8cff');
                    grad.addColorStop(1, '#2a5a8a');
                } else if (name === 'Júpiter') {
                    grad.addColorStop(0, '#f0d0a0');
                    grad.addColorStop(0.2, '#d4a06a');
                    grad.addColorStop(0.4, '#e8b880');
                    grad.addColorStop(0.6, '#c89060');
                    grad.addColorStop(0.8, '#b08860');
                    grad.addColorStop(1, '#8a6a4a');
                } else if (name === 'Saturno') {
                    grad.addColorStop(0, '#e0d098');
                    grad.addColorStop(0.3, '#d4c48a');
                    grad.addColorStop(0.6, '#c8b878');
                    grad.addColorStop(0.8, '#b8a868');
                    grad.addColorStop(1, '#a09058');
                } else if (name === 'Marte') {
                    grad.addColorStop(0, '#d46a4a');
                    grad.addColorStop(0.3, '#c45a3a');
                    grad.addColorStop(0.6, '#b84428');
                    grad.addColorStop(0.8, '#a03828');
                    grad.addColorStop(1, '#8a2a1a');
                } else if (name === 'Venus') {
                    grad.addColorStop(0, '#f5e6c8');
                    grad.addColorStop(0.3, '#f0dcc0');
                    grad.addColorStop(0.6, '#e8d0b0');
                    grad.addColorStop(0.8, '#dcc0a0');
                    grad.addColorStop(1, '#c8a888');
                } else if (name === 'Mercurio') {
                    grad.addColorStop(0, '#b5a8a0');
                    grad.addColorStop(0.4, '#a09080');
                    grad.addColorStop(0.7, '#8a7a6a');
                    grad.addColorStop(1, '#6a5a4a');
                } else if (name === 'Urano') {
                    grad.addColorStop(0, '#9ae8e8');
                    grad.addColorStop(0.3, '#7ad4d4');
                    grad.addColorStop(0.6, '#5ab8b8');
                    grad.addColorStop(0.8, '#4aa0a0');
                    grad.addColorStop(1, '#3a8888');
                } else if (name === 'Neptuno') {
                    grad.addColorStop(0, '#4a7adc');
                    grad.addColorStop(0.3, '#3a6acc');
                    grad.addColorStop(0.6, '#2a5ab8');
                    grad.addColorStop(0.8, '#1a4aaa');
                    grad.addColorStop(1, '#0a3a8a');
                } else {
                    grad.addColorStop(0, lightenColor(mainColor, 40));
                    grad.addColorStop(0.5, mainColor);
                    grad.addColorStop(1, darkenColor(mainColor, 40));
                }
                
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.stroke();
                
                if (name !== 'Mercurio') {
                    ctx.beginPath();
                    ctx.arc(x - radius * 0.15, y - radius * 0.15, radius * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255,255,255,0.08)";
                    ctx.fill();
                }
                
                if (name === 'Júpiter') {
                    for (let i = -3; i <= 3; i++) {
                        const bandY = y + i * radius * 0.15;
                        const bandWidth = radius * 0.7;
                        ctx.beginPath();
                        ctx.ellipse(x, bandY, bandWidth, radius * 0.04, 0, 0, Math.PI * 2);
                        ctx.strokeStyle = i % 2 === 0 ? 'rgba(180,120,80,0.3)' : 'rgba(240,200,160,0.2)';
                        ctx.lineWidth = radius * 0.05;
                        ctx.stroke();
                    }
                }
                
                if (name === 'Saturno') {
                    ctx.strokeStyle = 'rgba(212,196,138,0.7)';
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'rgba(212,196,138,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(x, y, radius * 1.8, radius * 0.3, 0.3, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(212,196,138,0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(x, y, radius * 1.5, radius * 0.25, 0.3, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.strokeStyle = 'rgba(200,180,120,0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.ellipse(x, y, radius * 1.65, radius * 0.28, 0.3, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                if (name === 'Urano' || name === 'Neptuno') {
                    ctx.strokeStyle = mainColor + '44';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 8]);
                    ctx.beginPath();
                    ctx.arc(x, y, radius * 1.25, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                
                if (name === 'Tierra') {
                    for (let cont of continentPoints) {
                        const translatedPoints = cont.points.map(p => ({
                            x: p.x + cont.offsetX,
                            y: p.y + cont.offsetY
                        }));
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = cont.color;
                        ctx.beginPath();
                        ctx.moveTo(translatedPoints[0].x, translatedPoints[0].y);
                        for (let i = 1; i < translatedPoints.length; i++) {
                            ctx.lineTo(translatedPoints[i].x, translatedPoints[i].y);
                        }
                        ctx.closePath();
                        ctx.fill();
                    }
                }
            }

            function lightenColor(color, amount) {
                let r = parseInt(color.slice(1,2), 16) * 17 || parseInt(color.slice(1,3), 16);
                let g = parseInt(color.slice(2,3), 16) * 17 || parseInt(color.slice(3,5), 16);
                let b = parseInt(color.slice(3,4), 16) * 17 || parseInt(color.slice(5,7), 16);
                r = Math.min(255, r + amount);
                g = Math.min(255, g + amount);
                b = Math.min(255, b + amount);
                return `rgb(${r},${g},${b})`;
            }

            function darkenColor(color, amount) {
                let r = parseInt(color.slice(1,2), 16) * 17 || parseInt(color.slice(1,3), 16);
                let g = parseInt(color.slice(2,3), 16) * 17 || parseInt(color.slice(3,5), 16);
                let b = parseInt(color.slice(3,4), 16) * 17 || parseInt(color.slice(5,7), 16);
                r = Math.max(0, r - amount);
                g = Math.max(0, g - amount);
                b = Math.max(0, b - amount);
                return `rgb(${r},${g},${b})`;
            }

            // ---------- Colisiones ----------
            function checkCollision(a, b) {
                const dx = a.x - b.x;
                const dy = a.y - b.y;
                const dist = Math.hypot(dx, dy);
                const threshold = a.collisionRadius + b.collisionRadius;
                return dist < threshold;
            }

            // ---------- Jugador ----------
            const player = {
                x: 200,
                y: 500,
                radius: 36,
                collisionRadius: 36 * 0.8,
                speed: 1.5,
                structure: 5,
                baseRadius: 36,
                kills: 0,
                rotation: 0,
                polygon: null,
                visible: true,
            };

                player.polygon = generateIrregularPolygon(player.radius, 10, 0.5);
                player.collisionRadius = calculateAverageRadius(player.polygon);
            }
            initPlayerPolygon();

            const playerColor = "#4fc3f7";
            const playerGlowColor = "rgba(79, 195, 247, 0.6)";
            const trailColor = "#81d4fa";

            // ---------- Planeta ----------
            let currentPlanet = {
                x: 200,
                y: -80,
                radius: 30,
                collisionRadius: 30 * 0.7,
                active: false,
                appearTime: 30,
                speed: 0.3,
                destroyed: false,
                color: '#4a8cff',
                name: 'Tierra',
                size_km: 12756,
                colors: ['#4a8cff', '#2d8a4e', '#8b7355']
            };

            function updatePlanetFromIndex(index) {
                const planet = PLANETS[index];

                currentPlanet.color = planet.color;

                currentPlanet.y = -radius - 50;
                currentPlanet.x = 200;
                currentPlanet.destroyed = false;
                currentColorIndex = index % ASTEROID_COLORS.length;
                updatePadInfo();
            }

            generateStaticContinents();

            let enemies = [];
            let ufos = [];
            let ufosSpawnedThisLevel = 0;
            const MAX_UFOS_PER_LEVEL = 2;
            let frameCounter = 0;
            let ufoSpawnCounter = 0;
            let ufoSpawnInterval = 600;
            let keys = { up: false, down: false, left: false, right: false };
            let gameActive = true;
            let gameOverFlag = false;
            let gameTime = 0;
            let gameWon = false;
            let gameOverTimeout = null;

            function showGameOverMessage(html, isWin) {
                pauseMusic();
                
                gameOverDiv.classList.remove('show', 'win', 'hidden');
                gameOverDiv.style.display = 'none';
                
                if (gameOverTimeout) {
                    clearTimeout(gameOverTimeout);
                    gameOverTimeout = null;
                }
                
                gameOverTimeout = setTimeout(() => {
                    let cleanHtml = html;
                    cleanHtml = cleanHtml.replace(/💥/g, '');
                    cleanHtml = cleanHtml.replace(/🌌/g, '');
                    cleanHtml = cleanHtml.replace(/🌍/g, '');
                    cleanHtml = cleanHtml.trim();
                    if (cleanHtml === '' || cleanHtml === '<br><small>¡Has completado el nivel!</small>') {
                        cleanHtml = '¡NIVEL COMPLETADO!<br><small>¡Has completado el nivel!</small>';
                    }
                    gameOverDiv.innerHTML = cleanHtml;
                    if (isWin) {
                        gameOverDiv.classList.add('win');
                    } else {
                        gameOverDiv.classList.remove('win');
                    }
                    gameOverDiv.style.display = 'block';
                    void gameOverDiv.offsetWidth;
                    gameOverDiv.classList.add('show');
                    gameOverDiv.classList.remove('hidden');

            function hideGameOverMessage() {

                }
                gameOverDiv.classList.remove('show', 'win');

            // ========== ACTUALIZAR INFO DEL PAD ==========
            function updatePadInfo() {
                const planet = PLANETS[currentPlanetIndex];
                padVel.textContent = '100%';

                padTimer.textContent = currentPlanet.active ? 'ACTIVO!' : `${timeLeft}s`;

            // ========== FUNCIONES DEL JUEGO ==========

            function resetGame() {
                hideGameOverMessage();
                
                player.x = 200;
                player.y = 500;
                player.structure = 5;
                player.radius = player.baseRadius;

                initPlayerPolygon();
                enemies = [];
                ufos = [];

                shockwaveRings = [];

                ufoSpawnCounter = 0;
                gameTime = 0;

                currentPlanet.y = -currentPlanet.radius - 50;
                currentPlanet.destroyed = false;
                const planet = PLANETS[currentPlanetIndex];
                enemyBaseSpeed = 2 + currentPlanetIndex * 0.3;
                spawnRate = Math.max(18, 35 - currentPlanetIndex * 1.5);

            // ---------- Dividir asteroide ----------
            function splitAsteroid(enemy, angle) {
                if (enemy.radius > 10) {
                    const newRadius = enemy.radius * 0.5;
                    if (newRadius > 5) {
                        const fragments = [];
                        const colorSet = ASTEROID_COLORS[currentColorIndex];
                        for (let d = 0; d < 2; d++) {
                            const dirOffset = (d === 0) ? -0.6 : 0.6;
                            const newAngle = angle + dirOffset + (Math.random() - 0.5) * 0.5;
                            const speed = 0.8 + Math.random() * 1.2;
                            const newPolygon = generateIrregularPolygon(newRadius, 6 + Math.floor(Math.random() * 4), 0.4 + Math.random() * 0.3);
                            const color = colorSet[Math.floor(Math.random() * colorSet.length)];
                            fragments.push({
                                x: enemy.x + Math.cos(newAngle) * 15,
                                y: enemy.y + Math.sin(newAngle) * 15,
                                radius: newRadius,
                                collisionRadius: newRadius,
                                speedX: Math.cos(newAngle) * speed + enemy.speedX * 0.2,
                                speedY: Math.sin(newAngle) * speed + enemy.speedY * 0.2,
                                polygon: newPolygon,
                                color,
                                shadowColor: "#cc5500",
                                rotation: Math.random() * Math.PI * 2,
                                rotSpeed: (Math.random() - 0.5) * 0.03,
                            });
                        }
                        return fragments;
                    }
                }
                return [];
            }

            // ---------- Spawn OVNI ----------
            function spawnUfo() {
                if (!gameActive) return;
                if (ufosSpawnedThisLevel >= MAX_UFOS_PER_LEVEL) return;
                
                const direction = Math.random() < 0.5 ? 1 : -1;
                const size = 12 + Math.random() * 8;
                const y = 50 + Math.random() * (H - 150);
                const speed = 1.5 + Math.random() * 1.5;
                const x = direction === 1 ? -size * 3 : W + size * 3;
                
                ufos.push({
                    x: x,
                    y: y,
                    size: size,
                    speed: speed * direction,
                    direction: direction,
                    collisionRadius: size * 0.8,
                    rotation: 0,
                    rotSpeed: (Math.random() - 0.5) * 0.02,
                    wobble: Math.random() * Math.PI * 2,
                    wobbleSpeed: 0.02 + Math.random() * 0.03,
                });
                ufosSpawnedThisLevel++;
            }

            // ---------- Colisiones ----------
            function spawnExplosionParticles(x, y, color, count) {
                for (let j = 0; j < count; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1 + Math.random() * 3;
                    trailParticles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1,
                        life: 0.6 + Math.random() * 0.3,
                        decay: 0.01 + Math.random() * 0.02,
                        size: 1.5 + Math.random() * 3,
                        color
                    });
                }
            }

            // ========== FUNCIÓN MODIFICADA: handleCollisions con sonido de colisión en OVNI ==========
            function handleCollisions() {
                if (!gameActive) return;

                // Colisión con planeta
                if (currentPlanet.active && currentPlanet.y < H + 100 && !currentPlanet.destroyed) {
                    const dx = player.x - currentPlanet.x;
                    const dy = player.y - currentPlanet.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < player.collisionRadius + currentPlanet.collisionRadius) {
                        gameActive = false;
                        gameOverFlag = true;
                        gameWon = true;
                        currentPlanet.destroyed = true;
                        playExplosionSound();
                        const radius = currentPlanet.radius;
                        const asteroidCount = Math.floor(25 + radius * 0.6);
                        spawnExplosionAsteroids(currentPlanet.x, currentPlanet.y, asteroidCount, radius, currentPlanet.colors);
                        spawnExplosionParticles(currentPlanet.x, currentPlanet.y, '#ff6b35', 15);
                        spawnExplosionParticles(currentPlanet.x, currentPlanet.y, '#ffaa00', 10);
                        spawnExplosionParticles(player.x, player.y, '#4fc3f7', 30);
                        spawnExplosionParticles(player.x, player.y, '#81d4fa', 20);
                        
                        spawnShockwaveRing(currentPlanet.x, currentPlanet.y, radius * 8, currentPlanet.colors[0], 60);
                        spawnShockwaveRing(currentPlanet.x, currentPlanet.y, radius * 6, '#ffffff', 50);
                        
                        player.visible = false;
                        const isLastPlanet = currentPlanetIndex >= PLANETS.length - 1;
                        
                        let msgHtml;
                        if (isLastPlanet) {
                            msgHtml = '¡SISTEMA SOLAR DESTRUIDO!<br><small>¡Has completado todos los planetas!</small>';
                            showGameOverMessage(msgHtml, true);
                            setTimeout(() => {
                                resetBtn.classList.add('visible');
                                nextLevelBtn.classList.remove('visible');
                            }, 3500);
                        } else {
                            msgHtml = `¡${currentPlanet.name} DESTRUIDO!<br><small>¡Has completado el nivel!</small>`;
                            showGameOverMessage(msgHtml, true);
                            setTimeout(() => {
                                nextLevelBtn.classList.add('visible');
                                resetBtn.classList.remove('visible');
                            }, 3500);
                        }
                        updatePadInfo();
                        return;
                    }
                }

                // Colisión entre asteroides enemigos
                for (let i = 0; i < enemies.length; i++) {
                    for (let j = i + 1; j < enemies.length; j++) {
                        const a = enemies[i];
                        const b = enemies[j];
                        if (checkCollision(a, b)) {
                            const dx = a.x - b.x;
                            const dy = a.y - b.y;
                            const angle = Math.atan2(dy, dx);
                            playCollisionSound();
                            const midX = (a.x + b.x) / 2;
                            const midY = (a.y + b.y) / 2;
                            spawnExplosionParticles(midX, midY, '#ff6b35', 10);
                            spawnExplosionParticles(midX, midY, '#ffaa33', 7);
                            const fragmentsA = splitAsteroid(a, angle);
                            const fragmentsB = splitAsteroid(b, angle + Math.PI);
                            enemies.splice(j, 1);
                            enemies.splice(i, 1);
                            enemies.push(...fragmentsA);
                            enemies.push(...fragmentsB);
                            break;
                        }
                    }
                }

                // Colisión del jugador con asteroides enemigos
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    if (checkCollision(player, enemy)) {
                        playCollisionSound();
                        const dx = player.x - enemy.x;
                        const dy = player.y - enemy.y;
                        const angle = Math.atan2(dy, dx);
                        spawnExplosionParticles(enemy.x, enemy.y, '#ff6b35', 20);
                        spawnExplosionParticles(enemy.x, enemy.y, '#ff8c00', 15);
                        spawnExplosionParticles(enemy.x, enemy.y, '#ffaa33', 10);
                        const fragments = splitAsteroid(enemy, angle + Math.PI);
                        player.structure = Math.max(0, player.structure - 1);
                        if (player.structure <= 0) {
                            player.visible = false;
                            player.radius = 0;
                            player.collisionRadius = 0;
                            player.polygon = [];
                            gameActive = false;
                            gameOverFlag = true;
                            const msgHtml = 'FRACASO<br><small>Tu asteroide se desintegró</small>';
                            showGameOverMessage(msgHtml, false);
                            setTimeout(() => {
                                resetBtn.classList.add('visible');
                                nextLevelBtn.classList.remove('visible');
                            }, 3500);
                            spawnExplosionParticles(player.x, player.y, '#81d4fa', 30);
                            spawnExplosionParticles(player.x, player.y, '#4fc3f7', 20);
                            spawnExplosionParticles(player.x, player.y, '#ffffff', 15);
                            updatePadInfo();
                            return;
                        }
                        player.radius = player.baseRadius * (0.7 + 0.3 * (player.structure / 5));
                        player.collisionRadius = player.radius * 0.8;
                        player.polygon = generateIrregularPolygon(player.radius, 8 + Math.floor(player.structure * 1.5), 0.5);
                        player.collisionRadius = calculateAverageRadius(player.polygon);
                        player.visible = true;
                        enemyBaseSpeed += 1;
                        spawnExplosionParticles(player.x, player.y, '#81d4fa', 10);
                        enemies.splice(i, 1);
                        enemies.push(...fragments);
                        updatePadInfo();
                    }
                }

                // ===== COLISIÓN DEL JUGADOR CON OVNI (CON SONIDO DE COLISIÓN) =====
                for (let i = ufos.length - 1; i >= 0; i--) {
                    const ufo = ufos[i];
                    if (checkCollision(player, ufo)) {
                        // SONIDO DE COLISIÓN
                        playCollisionSound();
                        
                        player.structure = Math.min(5, player.structure + 1);
                        player.radius = player.baseRadius * (0.7 + 0.3 * (player.structure / 5));
                        player.collisionRadius = player.radius * 0.8;
                        player.polygon = generateIrregularPolygon(player.radius, 8 + Math.floor(player.structure * 1.5), 0.5);
                        player.collisionRadius = calculateAverageRadius(player.polygon);
                        player.visible = true;
                        
                        spawnUfoExplosion(ufo.x, ufo.y);
                        spawnExplosionParticles(ufo.x, ufo.y, '#00ff88', 20);
                        spawnExplosionParticles(ufo.x, ufo.y, '#00ffcc', 15);
                        
                        ufos.splice(i, 1);
                        updatePadInfo();
                    }
                }

                // Colisión de OVNIs con asteroides enemigos
                for (let i = ufos.length - 1; i >= 0; i--) {
                    const ufo = ufos[i];
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const enemy = enemies[j];
                        if (checkCollision(ufo, enemy)) {
                            playCollisionSound();
                            spawnExplosionParticles(enemy.x, enemy.y, '#ff6b35', 15);
                            spawnExplosionParticles(enemy.x, enemy.y, '#ffaa33', 10);
                            enemies.splice(j, 1);
                            
                            spawnUfoExplosion(ufo.x, ufo.y);
                            spawnExplosionParticles(ufo.x, ufo.y, '#00ff88', 15);
                            ufos.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            // ---------- Spawn enemigos ----------
            function spawnEnemy() {
                if (!gameActive) return;
                const radius = 12 + Math.random() * 20;
                const x = 20 + Math.random() * (W - 40);
                const y = -radius - 10;
                const speedX = (Math.random() - 0.5) * 0.8;
                const vertices = 6 + Math.floor(Math.random() * 7);
                const irregularity = 0.4 + Math.random() * 0.4;
                const polygon = generateIrregularPolygon(radius, vertices, irregularity);
                const collisionRadius = calculateAverageRadius(polygon);
                const colorSet = ASTEROID_COLORS[currentColorIndex];
                const color = colorSet[Math.floor(Math.random() * colorSet.length)];
                enemies.push({
                    x, y,
                    radius,
                    collisionRadius: collisionRadius,
                    speedX,
                    speedY: enemyBaseSpeed,
                    polygon,
                    color,
                    shadowColor: "#cc5500",
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.025,
                });
            }

            // ---------- Actualización ----------
            function updateEnemies() {
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    e.x += e.speedX;
                    e.y += e.speedY;
                    e.rotation += e.rotSpeed;
                    if (e.y > H + 50 || e.x < -50 || e.x > W + 50) {
                        enemies.splice(i, 1);
                    }
                }
            }

            function updateUfos() {
                for (let i = ufos.length - 1; i >= 0; i--) {
                    const ufo = ufos[i];
                    ufo.x += ufo.speed;
                    ufo.wobble += ufo.wobbleSpeed;
                    ufo.y += Math.sin(ufo.wobble) * 0.5;
                    ufo.rotation += ufo.rotSpeed;
                    
                    if (ufo.x < -100 || ufo.x > W + 100) {
                        ufos.splice(i, 1);
                    }
                }
            }

            function updatePlayer() {
                if (!gameActive) return;
                const MOVE_SPEED = player.speed;
                let moveX = padX;
                let moveY = padY;
                if (keys.up) moveY = -1;
                if (keys.down) moveY = 1;
                if (keys.left) moveX = -1;
                if (keys.right) moveX = 1;
                if (moveX !== 0 && moveY !== 0) {
                    const len = Math.hypot(moveX, moveY);
                    moveX /= len;
                    moveY /= len;
                }
                player.x += moveX * MOVE_SPEED;
                player.y += moveY * MOVE_SPEED;
                player.x = Math.max(player.radius + 2, Math.min(W - player.radius - 2, player.x));
                player.y = Math.max(player.radius + 2, Math.min(H - player.radius - 2, player.y));
                player.rotation += 0.02;
                if (gameActive && player.visible) {
                    const spreadArea = player.radius * 0.8;
                    
                    for (let i = 0; i < 3; i++) {
                        const xOffset = (Math.random() - 0.5) * spreadArea * 1.2;
                        const yOffset = -5;
                        
                        const cos = Math.cos(player.rotation);
                        const sin = Math.sin(player.rotation);
                        const rotatedX = xOffset * cos - yOffset * sin;
                        const rotatedY = xOffset * sin + yOffset * cos;
                        
                        const px = player.x + rotatedX;
                        const py = player.y + rotatedY;
                        
                        const particleSize = 1 + Math.random() * 2;
                        spawnTrailParticle(px, py, trailColor, particleSize);
                    }
                }
                updatePadInfo();
            }

            // ---------- Dibujar ----------
            function draw() {
                ctx.clearRect(0, 0, W, H);
                starOffset += STAR_SPEED;
                if (starOffset > H * 2) starOffset -= H * 2;
                for (let layer = 0; layer < 3; layer++) {
                    const layerSpeed = 1 + layer * 0.5;
                    const layerOffset = (starOffset * layerSpeed) % (H * 2);
                    for (let star of stars) {
                        if (star.layer !== layer) continue;
                        let yPos = (star.y + layerOffset) % (H * 2);
                        if (yPos > H) yPos -= H * 2;
                        if (yPos < -H) yPos += H * 2;
                        const alpha = star.brightness * 0.4;
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = "#ffffff";
                        ctx.beginPath();
                        ctx.arc(star.x, yPos, star.size * (0.5 + layer * 0.25), 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;

                if (currentPlanet.active && !currentPlanet.destroyed) {
                    drawPlanet(ctx, currentPlanet, currentPlanet.radius);
                } else if (!currentPlanet.destroyed && !currentPlanet.active) {
                    ctx.fillStyle = "#ff883366";
                    ctx.font = "bold 16px monospace";
                    ctx.textAlign = "center";
                    const timeLeft = Math.max(0, Math.ceil(currentPlanet.appearTime - gameTime));
                    ctx.fillText(`${currentPlanet.name} en ${timeLeft}s`, 200, 30);
                    ctx.textAlign = "left";
                }

                drawExplosionAsteroids();
                drawTrailParticles();
                drawUfoExplosionParticles();
                drawShockwaveRings();

                for (let ufo of ufos) {
                    drawUfo(ctx, ufo);
                }

                for (let e of enemies) {
                    drawPlayerPolygon(ctx, e.x, e.y, e.polygon, e.color, e.shadowColor || "#cc5500", e.rotation, false);
                }

                if (player.visible) {
                    drawPlayerPolygon(ctx, player.x, player.y, player.polygon, playerColor, "#4fc3f7", player.rotation, true, playerGlowColor);
                }
            }

            // ---------- Bucle ----------
            function loop() {
                if (!gameOverFlag) {
                    gameTime += 1/60;
                    if (gameTime >= currentPlanet.appearTime && !currentPlanet.active) {
                        currentPlanet.active = true;
                    }
                    if (currentPlanet.active && !currentPlanet.destroyed) {
                        currentPlanet.y += currentPlanet.speed;
                    }
                    frameCounter++;
                    ufoSpawnCounter++;
                    
                    if (frameCounter >= spawnRate) {
                        frameCounter = 0;
                        spawnEnemy();
                    }
                    
                    if (ufoSpawnCounter >= ufoSpawnInterval) {
                        ufoSpawnCounter = 0;
                        spawnUfo();
                        ufoSpawnInterval = 450 + Math.random() * 450;
                    }
                    
                    updatePlayer();
                    updateEnemies();
                    updateUfos();
                    updateTrailParticles();
                    updateExplosionAsteroids();
                    updateUfoExplosionParticles();
                    updateShockwaveRings();
                    handleCollisions();
                    updatePadInfo();
                } else {
                    updateTrailParticles();
                    updateExplosionAsteroids();
                    updateUfoExplosionParticles();
                    updateShockwaveRings();
                }
                draw();
                requestAnimationFrame(loop);
            }

            // ---------- Siguiente Nivel ----------
            function goToNextLevel() {
                hideGameOverMessage();
                
                currentPlanetIndex++;
                if (currentPlanetIndex >= PLANETS.length) {
                    currentPlanetIndex = 0;
                }
                updatePlanetFromIndex(currentPlanetIndex);
                resetGame();
                enemyBaseSpeed = 2 + currentPlanetIndex * 0.3;
                spawnRate = Math.max(18, 35 - currentPlanetIndex * 1.5);
                updatePadInfo();
                if (!musicActive && !isMusicPaused) {
                    startArcadeMusic();
                } else if (isMusicPaused) {
                    resumeMusic();
                }
            }

            // ---------- Eventos ----------
            function keydownHandler(e) {
                const key = e.key;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'].includes(key)) {
                    e.preventDefault();
                }
                switch (key) {
                    case 'ArrowUp': case 'w': case 'W': keys.up = true; break;
                    case 'ArrowDown': case 's': case 'S': keys.down = true; break;
                    case 'ArrowLeft': case 'a': case 'A': keys.left = true; break;
                    case 'ArrowRight': case 'd': case 'D': keys.right = true; break;
                }
            }

            function keyupHandler(e) {
                const key = e.key;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'].includes(key)) {
                    e.preventDefault();
                }
                switch (key) {
                    case 'ArrowUp': case 'w': case 'W': keys.up = false; break;
                    case 'ArrowDown': case 's': case 'S': keys.down = false; break;
                    case 'ArrowLeft': case 'a': case 'A': keys.left = false; break;
                    case 'ArrowRight': case 'd': case 'D': keys.right = false; break;
                }
            }

            window.addEventListener('keydown', keydownHandler);
            window.addEventListener('keyup', keyupHandler);

            resetBtn.addEventListener('click', resetGame);
            nextLevelBtn.addEventListener('click', goToNextLevel);

            updatePlanetFromIndex(0);
            resetGame();
            loop();

            window.addEventListener('unload', () => {
                window.removeEventListener('keydown', keydownHandler);
                window.removeEventListener('keyup', keyupHandler);
                stopArcadeMusic();
            });

        })();
    </script>
</body>
</html>
